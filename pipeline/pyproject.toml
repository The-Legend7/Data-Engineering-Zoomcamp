[project]
name = "pipeline"
version = "0.1.0"
description = "A simple ETL pipeline script"
readme = "README.md"
authors = [
    { name = "Pablo", email = "59513645+The-Legend7@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "pandas>=3.0.6",
    "pyarrow>=25.0.1",
]

[tool.uv]
package = false

[project.scripts]
pipeline = "pipeline:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pgcli>=4.7.1",
]
